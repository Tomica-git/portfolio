<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="マクロ導入で撮影時の記録項目は増えたが、後工程の入力・転記・確認が約5分の1になり、差し引きで全体が約3分の1短縮した比較グラフ">
  <defs>
    <pattern id="inc" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#B6C2CF"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#CF222E" stroke-width="3"/>
    </pattern>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",-apple-system,"Segoe UI",sans-serif}
    .t1{font-size:28px;font-weight:700;fill:#1F2328}
    .t2{font-size:16px;fill:#57606A}
    .lab{font-size:16px;font-weight:700;fill:#1F2328}
    .seg{font-size:13px;fill:#1F2328}
    .segw{font-size:13px;font-weight:700;fill:#3D2E00}
    .note{font-size:13px;fill:#57606A}
    .win{font-size:18px;font-weight:700;fill:#1A7F37}
    .up{font-size:13px;font-weight:700;fill:#CF222E}
    .dn{font-size:15px;font-weight:700;fill:#1A7F37}
  </style>
  <rect x="0" y="0" width="1200" height="470" fill="#FFFFFF"/>

  <text class="t1" x="40" y="38">マクロで何が増えて、何が減ったのか</text>
  <text class="t2" x="40" y="66">撮影時の記録項目は増えた。そのぶん後工程の入力・転記・確認が約 5 分の 1 に。差し引きで全体は約 3 分の 1 短縮。</text>

  <!-- BEFORE -->
  <text class="lab" x="240" y="152" text-anchor="end">従来（手作業）</text>
  <rect x="260" y="120" width="450" height="54" fill="#B6C2CF" stroke="#8C959F"/>
  <rect x="710" y="120" width="450" height="54" fill="#E3B341" stroke="#BF8700" stroke-width="2"/>
  <text class="seg"  x="485" y="152" text-anchor="middle">撮影・観察・測定</text>
  <text class="segw" x="935" y="152" text-anchor="middle">入力・転記・確認（手作業の繰り返し）</text>

  <!-- annotations between bars -->
  <text class="up" x="741" y="200" text-anchor="middle">記録項目が増えた分</text>
  <path d="M741 206 L741 224" stroke="#CF222E" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M935 180 C 935 208, 838 200, 828 222" fill="none" stroke="#1A7F37" stroke-width="2.5" marker-end="url(#a4g)"/>
  <text class="dn" x="960" y="206">約 5 分の 1 に</text>

  <!-- AFTER -->
  <text class="lab" x="240" y="262" text-anchor="end">マクロ導入後</text>
  <rect x="260" y="230" width="450" height="54" fill="#B6C2CF" stroke="#8C959F"/>
  <rect x="710" y="230" width="63"  height="54" fill="url(#inc)" stroke="#CF222E" stroke-width="2"/>
  <rect x="773" y="230" width="90"  height="54" fill="#E3B341" stroke="#BF8700" stroke-width="2"/>
  <text class="seg" x="485" y="262" text-anchor="middle">撮影・観察・測定</text>
  <text class="seg" x="818" y="306" text-anchor="middle">入力・転記・確認</text>
  <path d="M818 300 L818 288" stroke="#8C959F" stroke-width="1.5"/>

  <!-- saved bracket -->
  <line x1="863" y1="230" x2="863" y2="214" stroke="#1A7F37" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="1160" y1="120" x2="1160" y2="336" stroke="#1A7F37" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="863" y1="336" x2="863" y2="322" stroke="#1A7F37" stroke-width="2"/>
  <line x1="1160" y1="336" x2="1160" y2="322" stroke="#1A7F37" stroke-width="2"/>
  <line x1="863" y1="336" x2="1160" y2="336" stroke="#1A7F37" stroke-width="2"/>
  <text class="win" x="1011" y="360" text-anchor="middle">全体で約 3 分の 1 短縮</text>

  <!-- legend -->
  <rect x="260" y="382" width="16" height="16" fill="#B6C2CF" stroke="#8C959F"/>
  <text class="note" x="284" y="395">撮影・観察・測定（自動化の対象外）</text>
  <rect x="560" y="382" width="16" height="16" fill="url(#inc)" stroke="#CF222E"/>
  <text class="note" x="584" y="395">ファイル名へ測定値を記録（導入後に増えた分）</text>
  <rect x="920" y="382" width="16" height="16" fill="#E3B341" stroke="#BF8700"/>
  <text class="note" x="944" y="395">入力・転記・確認（マクロが担当）</text>

  <rect x="260" y="412" width="900" height="46" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text class="note" x="278" y="432">※ 「比較・考察」はデータを受け取った上層部が判断する工程のため、担当範囲外として含めていない。</text>
  <text class="note" x="278" y="450">※ 実測ログではなく当時の作業実感に基づく概算。内訳の比率はイメージ。</text>
</svg>
